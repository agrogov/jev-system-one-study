api:
  base_url: "https://api.typesafe.ai"
  endpoint: "/v1/systemone"
  model: "jev-latest"
  timeout_seconds: 60
  concurrency: 4
  max_retries: 5
  min_retry_seconds: 1.0
  max_retry_seconds: 30.0

run:
  suite: "semantic"
  seed: 260919
  output_dir: "results"
  profile: "semantic_core"   # semantic_smoke | semantic_core | semantic_full
  save_request_bodies: true
  save_response_bodies: true

profiles:
  semantic_smoke:
    variants_per_scenario: 2
    noise_units: [0, 2]
    permute_option_order: true
    ambiguous_repeat_repetitions: 2

  semantic_core:
    variants_per_scenario: 10
    noise_units: [0, 2, 6, 12]
    permute_option_order: true
    ambiguous_repeat_repetitions: 10

  semantic_full:
    variants_per_scenario: 30
    noise_units: [0, 2, 6, 12, 24]
    permute_option_order: true
    ambiguous_repeat_repetitions: 30
